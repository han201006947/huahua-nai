name: Gallery Sync and Deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/inject-site-url.mjs'
      - 'scripts/fix-dist-html.ps1'
      - 'scripts/fix-dist-html.mjs'
      - 'scripts/write-deploy-config-ci.mjs'
      - 'scripts/deploy-gh-pages-ci.mjs'
      - 'scripts/optimize-dist-images.mjs'
      - 'scripts/optimize-dist-videos.mjs'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/gallery-sync-deploy.yml'

permissions:
  contents: write

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Sync galleryAlbums.js
        run: npm run sync-gallery

      - name: Commit sync result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/galleryAlbums.js
          git diff --staged --quiet || git commit -m "chore: sync galleryAlbums [skip ci]"

      - name: Push sync commit
        run: git push

      - name: Write deploy.config for CI
        run: node scripts/write-deploy-config-ci.mjs

      - name: Install ffmpeg for video compression
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build site
        run: npm run build:ci

      - name: Deploy gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-gh-pages-ci.mjs
