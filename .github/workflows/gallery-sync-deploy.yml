name: Gallery Sync and Deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'public/**'
      - 'public/gallery-revision.json'
      - 'src/data/galleryAlbums.js'
      - 'src/data/galleryCategories.custom.json'
      - 'src/data/galleryAlbums.overrides.js'

permissions:
  contents: write

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Sync galleryAlbums.js
        run: npm run sync-gallery

      - name: Commit sync result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/galleryAlbums.js
          git diff --staged --quiet || git commit -m "chore: sync galleryAlbums [skip ci]"

      - name: Push sync commit
        run: git push

      - name: Build and deploy gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx gh-pages -d dist -f
